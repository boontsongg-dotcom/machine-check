<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกการเกิด Loss</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">บันทึกการเกิด Loss</h4>
        </div>
        <div class="card-body">
            <form id="lossForm">
                <div class="mb-3">
                    <label class="form-label">ผู้รายงาน</label>
                    <input type="text" class="form-control" id="reporter" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">รายละเอียด / สาเหตุ</label>
                    <textarea class="form-control" id="detail" rows="3" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">แนบรูปภาพ (ระบบจะย่อขนาดอัตโนมัติ)</label>
                    <input type="file" class="form-control" id="imageFile" accept="image/*" required>
                </div>
                <button type="submit" class="btn btn-primary" id="submitBtn">บันทึกข้อมูล</button>
            </form>
        </div>
    </div>

    <!-- Data Table สำหรับแสดงผล -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0">ประวัติการเกิด Loss</h5>
            <button class="btn btn-sm btn-outline-light" onclick="loadData()">รีเฟรชข้อมูล</button>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-striped" id="dataTable">
                    <thead>
                        <tr>
                            <th>วันที่-เวลา</th>
                            <th>ผู้รายงาน</th>
                            <th>รายละเอียด</th>
                            <th>รูปภาพ</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="4" class="text-center">กำลังโหลดข้อมูล...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // --- เปลี่ยน URL ตรงนี้เป็น URL ที่ได้จาก Google Apps Script ---
    const GAS_API_URL = 'ใส่_URL_WEB_APP_ของ_GOOGLE_APPS_SCRIPT_ตรงนี้';

    // ฟังก์ชันย่อขนาดภาพ
    function compressImage(file, maxWidth, quality) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // แปลงเป็น JPEG แบบบีบอัด
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
            };
            reader.onerror = error => reject(error);
        });
    }

    // จัดการตอนกดส่งฟอร์ม
    document.getElementById('lossForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = 'กำลังบันทึก...';

        const fileInput = document.getElementById('imageFile');
        let base64Image = "";

        if (fileInput.files.length > 0) {
            // ย่อรูปความกว้างไม่เกิน 800px, quality 70%
            base64Image = await compressImage(fileInput.files[0], 800, 0.7);
        }

        const payload = {
            reporter: document.getElementById('reporter').value,
            detail: document.getElementById('detail').value,
            imageBase64: base64Image
        };

        try {
            const response = await fetch(GAS_API_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            const result = await response.json();
            
            if(result.status === 'success') {
                alert('บันทึกสำเร็จ');
                this.reset();
                loadData(); // รีเฟรชตาราง
            } else {
                alert('เกิดข้อผิดพลาด: ' + result.message);
            }
        } catch (error) {
            alert('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้');
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'บันทึกข้อมูล';
        }
    });

    // ดึงข้อมูลมาแสดงใน Data Table
    async function loadData() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '<tr><td colspan="4" class="text-center">กำลังโหลดข้อมูล...</td></tr>';
        
        try {
            const response = await fetch(GAS_API_URL);
            const result = await response.json();
            
            if (result.status === 'success') {
                tbody.innerHTML = '';
                if(result.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center">ยังไม่มีข้อมูล</td></tr>';
                    return;
                }
                
                result.data.forEach(row => {
                    // จัดการ Format วันที่เบื้องต้น
                    let dateStr = new Date(row.date).toLocaleString('th-TH');
                    let imgLink = row.image ? `<a href="${row.image}" target="_blank" class="btn btn-sm btn-info">ดูรูป</a>` : '-';
                    
                    tbody.innerHTML += `
                        <tr>
                            <td>${dateStr}</td>
                            <td>${row.reporter}</td>
                            <td>${row.detail}</td>
                            <td>${imgLink}</td>
                        </tr>
                    `;
                });
            }
        } catch (error) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center text-danger">ดึงข้อมูลล้มเหลว</td></tr>';
        }
    }

    // โหลดข้อมูลทันทีเมื่อเปิดเว็บ
    window.onload = loadData;
</script>

</body>
</html>
