<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ระบบเช็คเครื่องจักรประจำกะ</title>
  
  <!-- PWA Core Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="เช็คเครื่องจักร">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3011/3011270.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3011/3011270.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0f172a;
    }
    #appFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* ปุ่มติดตั้งลอย (จะแสดงเฉพาะเครื่องที่ยังไม่ได้ติดตั้ง) */
    #installBanner {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #2563eb;
      color: white;
      padding: 10px 20px;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      font-family: sans-serif;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      z-index: 9999;
      border: 2px solid white;
    }
  </style>
</head>
<body>

  <!-- แทนที่ URL ของ Google Apps Script ใน src ด้านล่างนี้ -->
  <iframe 
    id="appFrame" 
    src="ใส่_URL_WEB_APP_ของ_GAS_ที่นี่" 
    allow="camera; microphone; geolocation" 
    loading="lazy">
  </iframe>

  <div id="installBanner" onclick="triggerInstall()">
    📲 ติดตั้งแอปลงมือถือ
  </div>

  <script>
    // ลงทะเบียน Service Worker เพื่อผ่านเงื่อนไข PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('SW Registered'))
          .catch((err) => console.error('SW Error:', err));
      });
    }

    // ดักจับ Event สำหรับปุ่ม Install
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById('installBanner');
      if (banner) banner.style.display = 'block';
    });

    function triggerInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choice) => {
          if (choice.outcome === 'accepted') {
            document.getElementById('installBanner').style.display = 'none';
          }
          deferredPrompt = null;
        });
      }
    }

    window.addEventListener('appinstalled', () => {
      document.getElementById('installBanner').style.display = 'none';
    });
  </script>
</body>
</html>
